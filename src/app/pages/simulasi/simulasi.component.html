<app-main>
    <div class="flex flex-col w-full p-0">
        <div *ngIf="IsGuru" class="flex flex-row justify-between gap-3 w-full px-5 mt-2">
            <div class="flex gap-3 w-6/12">
                <!-- Dropdown Kelas -->
                <div class="grid w-4/12">
                    <p-dropdown styleClass="p-inputtext-sm w-full" placeholder="Pilih Kelas" [options]="KelasDatasource"
                        optionLabel="kelas" optionValue="id_kelas" appendTo="body" [filter]="true"
                        [(ngModel)]="SelectedKelas" (onChange)="handleChangeKelas($event)">
                    </p-dropdown>
                </div>

                <!-- Dropdown Siswa -->
                <div class="grid w-4/12">
                    <p-dropdown styleClass="p-inputtext-sm w-full" placeholder="Pilih Siswa" [options]="SiswaDatasource"
                        optionLabel="nama_lengkap" optionValue="id_siswa" appendTo="body" [filter]="true"
                        [(ngModel)]="SelectedSiswa" [disabled]="!SelectedKelas" (onChange)="getAllSimulasi()">
                    </p-dropdown>
                </div>
            </div>

            <!-- Dropdown Siswa -->
            <div class="flex w-6/12 justify-end gap-3">
                <div class="grid w-5/12">
                    <p-inputNumber styleClass="p-inputtext-sm w-full" placeholder="Input nilai tugas siswa" [max]="100"
                        [(ngModel)]="Nilai">
                    </p-inputNumber>
                </div>

                <p-button severity="success" label="Simpan Nilai Siswa" styleClass="p-button-sm"
                    (onClick)="handleUpdateNilai(Nilai)">
                </p-button>
            </div>
        </div>

        <div *ngIf="SimulasiDatasource" class="flex flex-row items-start w-full gap-3 py-3 px-5">
            <!-- List Section -->
            <div class="w-2/12 flex flex-col gap-2 overflow-x-auto p-2" style="max-height: calc(100vh - 6rem);">
                <div *ngFor="let item of SimulasiSections; let i = index"
                    class="flex flex-row justify-center w-full {{ SelectedSimulasiSections == item.value ? 'bg-orange-200 border border-solid border-white' : 'bg-gray-200' }} rounded-md drop-shadow py-1"
                    (click)="handleClickSectionSimulasi(item.value)">
                    <p
                        class="{{ SelectedSimulasiSections == item.value  ? 'text-orange-600' : 'text-gray-500' }} text-xs">
                        {{ item.label }}
                    </p>
                </div>
            </div>

            <!-- List Pertanyaan -->
            <div class="w-10/12 flex flex-col gap-2 bg-white rounded-lg p-2">
                <div class="flex items-center w-full p-2 mb-0">
                    <div
                        class="flex w-auto p-2 mx-auto rounded-xl items-center justify-center bg-orange-200 text-orange-600 border border-solid border-white">
                        <p class="text-sm font-semibold text-center">
                            {{ SimulasiDatasource.judul }}
                        </p>
                    </div>
                </div>

                <p *ngIf="SelectedSimulasiSections != 'jawaban_simulasi'"
                    class="text-sm text-gray-800 font-semibold text-justify leading-none mb-2"
                    [innerHTML]="SimulasiDatasource[SelectedSimulasiSections]">
                </p>

                <div *ngIf="SelectedSimulasiSections == 'jawaban_simulasi'" [formGroup]="Form"
                    class="flex flex-col w-full">
                    <!-- Header -->
                    <div
                        class="grid grid-cols-2 grid-rows-2 w-full gap-2 grid-flow-col mb-3 pb-4 border-b border-t-0 border-x-0 border-dashed border-gray-400">
                        <!-- Untuk -->
                        <div class="flex w-full gap-2 items-center">
                            <div class="w-4/12">
                                <p class="text-sm text-gray-700 font-medium">
                                    Untuk
                                </p>
                            </div>
                            <div class="w-8/12 grid">
                                <input type="text" pInputText class="p-inputtext-sm w-full" formControlName="untuk">
                            </div>
                        </div>

                        <!-- Dept -->
                        <div class="flex w-full gap-2 items-center">
                            <div class="w-4/12">
                                <p class="text-sm text-gray-700 font-medium">
                                    Dept
                                </p>
                            </div>
                            <div class="w-8/12 grid">
                                <input type="text" pInputText class="p-inputtext-sm w-full" formControlName="dept">
                            </div>
                        </div>

                        <!-- Tanggal -->
                        <div class="flex w-full gap-2 items-center">
                            <div class="w-4/12">
                                <p class="text-sm text-gray-700 font-medium">
                                    Tanggal
                                </p>
                            </div>
                            <div class="w-8/12 grid">
                                <p-calendar styleClass="p-inputtext-sm w-full" dateFormat="dd-mm-yy"
                                    formControlName="tanggal" appendTo="body">
                                </p-calendar>
                            </div>
                        </div>

                        <!-- Waktu -->
                        <div class="flex w-full gap-2 items-center">
                            <div class="w-4/12">
                                <p class="text-sm text-gray-700 font-medium">
                                    Waktu
                                </p>
                            </div>
                            <div class="w-8/12 grid">
                                <p-calendar styleClass="p-inputtext-sm w-full" hourFormat="24" formControlName="waktu"
                                    appendTo="body" [timeOnly]="true">
                                </p-calendar>
                            </div>
                        </div>
                    </div>

                    <!-- Dari -->
                    <div
                        class="grid grid-cols-1 grid-rows-3 w-full gap-2 grid-flow-col mb-3 pb-4 border-b border-t-0 border-x-0 border-dashed border-gray-400">
                        <!-- Dari -->
                        <div class="flex w-full gap-2 items-center">
                            <div class="w-2/12">
                                <p class="text-sm text-gray-700 font-medium">
                                    Dari
                                </p>
                            </div>
                            <div class="w-10/12 grid">
                                <input type="text" pInputText class="p-inputtext-sm w-full" formControlName="dari">
                            </div>
                        </div>

                        <!-- Perusahaan -->
                        <div class="flex w-full gap-2 items-center">
                            <div class="w-2/12">
                                <p class="text-sm text-gray-700 font-medium">
                                    Perusahaan
                                </p>
                            </div>
                            <div class="w-10/12 grid">
                                <input type="text" pInputText class="p-inputtext-sm w-full"
                                    formControlName="perusahaan">
                            </div>
                        </div>

                        <!-- Telepon -->
                        <div class="flex w-full gap-2 items-center">
                            <div class="w-2/12">
                                <p class="text-sm text-gray-700 font-medium">
                                    Telepon
                                </p>
                            </div>
                            <div class="w-10/12 grid">
                                <input type="text" pInputText class="p-inputtext-sm w-full" formControlName="telepon">
                            </div>
                        </div>
                    </div>

                    <!-- Isi Pesan -->
                    <div class="grid gap-2 mb-3 pb-4 border-b border-t-0 border-x-0 border-dashed border-gray-400">
                        <p class="text-sm text-gray-700 font-medium">
                            Isi Pesan
                        </p>
                        <p-editor formControlName="isi_pesan" [style]="{ height: '320px' }" />
                    </div>

                    <!-- Keterangan -->
                    <div class="grid gap-2 mb-3 pb-4 border-b border-t-0 border-x-0 border-dashed border-gray-400">
                        <p class="text-sm text-gray-700 font-medium">
                            Keterangan
                        </p>

                        <div class="flex flex-wrap gap-3">
                            <div class="flex align-items-center">
                                <p-radioButton name="keterangan" value="Mohon Telepon Kembali"
                                    formControlName="keterangan" inputId="ingredient1" />
                                <label for="ingredient1" class="ml-2 text-sm">
                                    Mohon Telepon Kembali
                                </label>
                            </div>

                            <div class="flex align-items-center">
                                <p-radioButton name="keterangan" value="Penting" formControlName="keterangan"
                                    inputId="ingredient2" />
                                <label for="ingredient2" class="ml-2 text-sm">
                                    Penting
                                </label>
                            </div>

                            <div class="flex align-items-center">
                                <p-radioButton name="keterangan" value="Akan Telepon Kembali"
                                    formControlName="keterangan" inputId="ingredient3" />
                                <label for="ingredient3" class="ml-2 text-sm">
                                    Akan Telepon Kembali
                                </label>
                            </div>

                            <div class="flex align-items-center">
                                <p-radioButton name="keterangan" value="Hanya Menelepon" formControlName="keterangan"
                                    inputId="ingredient4" />
                                <label for="ingredient4" class="ml-2 text-sm">
                                    Hanya Menelepon
                                </label>
                            </div>
                        </div>
                    </div>

                    <!-- Nama Penerima -->
                    <div
                        class="flex w-full justify-center items-center mb-3 pb-4 border-b border-t-0 border-x-0 border-dashed border-gray-400">

                        <div class="flex flex-col w-4/12 items-center">
                            <p class="text-sm text-gray-700 mb-10 text-center">
                                Diterima Oleh :
                            </p>
                            <p *ngIf="Profile$ | async as profile" class="text-sm text-gray-700 text-center">
                                ( {{ profile.nama_lengkap }} )
                            </p>
                        </div>
                    </div>

                </div>

                <div *ngIf="SelectedSimulasiSections == 'jawaban_simulasi' && !IsGuru"
                    class="flex flex-row justify-end mt-auto">
                    <p-button severity="info" styleClass="p-button-sm" icon="pi pi-save" label="Simpan"
                        (click)="handleSaveSimulasi(Form.value)">
                    </p-button>
                </div>
            </div>
        </div>
    </div>
</app-main>
