    <div class="flex flex-row w-full gap-3 py-3 px-5">
        <!-- List Pertanyaan -->
        <div class="w-3/12 flex flex-col gap-2">
            <div *ngFor="let item of ProfileMenu; let i = index"
                class="flex flex-row justify-center w-full {{ SelectedMateriIndex == i ? 'bg-orange-200 border border-solid border-white' : 'bg-gray-200' }} rounded-md drop-shadow py-1"
                (click)="handleClickMenu(item, i)">
                <p class="{{ SelectedMateriIndex == i  ? 'text-orange-600' : 'text-gray-500' }} text-xs">
                    {{ item.menu }}
                </p>
            </div>
        </div>

        <!-- List Pertanyaan -->
        <div *ngIf="SelectedMateri" class="w-9/12 flex flex-col gap-2 bg-white rounded-lg p-3">
            <p class="text-sm text-gray-700" [innerHTML]="SelectedMateri.content"></p>
        </div>
    </div>
</app-main>
